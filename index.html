<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LO-CAD v5 // MOBILE CUTTER</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="container">

    <div class="settings-panel">
        <div class="setting-group">
            <label>📏 Хлыст базы</label>
            <input type="number" id="cfg_stock_len" value="6000">
        </div>

        <div class="setting-group">
            <label>🪓 Пропил</label>
            <input type="number" id="cfg_blade_thick" value="3">
        </div>

        <div class="setting-group">
            <label>🤏 Допуск</label>
            <input type="number" id="cfg_tolerance" value="0">
        </div>

        <div class="setting-group">
            <label>🎯 Стратегия</label>
            <select id="cfg_mode">
                <option value="0">🚀 Максимальный кусок</option>
                <option value="1">⚖️ Равномерные остатки</option>
            </select>
        </div>
    </div>

    <div class="data-section">
        <div class="section-title">📦 Детали проекта</div>
        <div id="req_rows_container" class="rows-container"></div>
        <button class="btn btn-add-req" onclick="addReqRow()">➕ Добавить деталь</button>
    </div>

    <div class="data-section">
        <div class="section-title">🪵 Обрезки в наличии</div>
        <div id="stock_rows_container" class="rows-container"></div>
        <button class="btn btn-add-stock" onclick="addStockRow()">➕ Добавить обрезок</button>
    </div>

    <button class="btn btn-calc" onclick="processCalculation()">РАССЧИТАТЬ КАРТУ РАСКРОЯ</button>

    <div class="output-side" id="output_side"></div>

</div>

<script src="script.js"></script>
</body>
</html>
